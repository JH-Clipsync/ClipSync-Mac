name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（如 1.0.0），不填则用 Info.plist 里的原值'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ClipSync.app
    # project objectVersion=77 = Xcode 16+，需要 macos-15 runner
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode（macos-15 runner）
        run: |
          # macos-15 runner 默认装的是 Xcode 16 系列，目录命名是 Xcode_16.X.app
          # 用 sudo 是因为 xcode-select --switch 在新系统需要 root
          XCODE_PATH="/Applications/Xcode_16.4.app"
          if [ ! -d "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.*.app | sort -V | tail -n 1)
          fi
          echo "选择 Xcode: $XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 注入 Marketing Version（仅 workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.versionName }}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" ClipSync/Info.plist
          echo "CFBundleShortVersionString=$VERSION"

      - name: Archive
        run: |
          xcodebuild \
            -project ClipSync.xcodeproj \
            -scheme ClipSync \
            -configuration Release \
            -archivePath build/ClipSync.xcarchive \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 导出 .app
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R build/ClipSync.xcarchive/Products/Applications/ClipSync.app dist/
          echo "📦 已生成 .app："
          ls -la dist/ClipSync.app
          du -sh dist/ClipSync.app

      - name: 打包成 zip
        run: |
          cd dist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ../ClipSync/Info.plist)
          ZIP_NAME="ClipSync-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent ClipSync.app "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          ls -la "$ZIP_NAME"

      - name: 打包成 DMG
        run: |
          cd dist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ../ClipSync/Info.plist)
          DMG_NAME="ClipSync-${VERSION}.dmg"
          hdiutil create -volname "ClipSync ${VERSION}" -srcfolder ClipSync.app -ov -format UDZO "$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          ls -la "$DMG_NAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: clip-sync-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: build
    # push tag 或 workflow_dispatch 都建 Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.versionName }}"
            if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
            echo "RELEASE_TAG=v$VERSION" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/v}
            echo "RELEASE_TAG=v$TAG" >> $GITHUB_OUTPUT
            VERSION=$TAG
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.RELEASE_TAG }}
          name: 'ClipSync Mac v${{ steps.ver.outputs.VERSION }}'
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
