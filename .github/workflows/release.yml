name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（如 1.0.0），不填则用 Info.plist 里的原值'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ClipSync.app
    # project objectVersion=77 = Xcode 16+，需要 macos-15 runner
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode（macos-15 runner）
        run: |
          # macos-15 runner 默认装的是 Xcode 16 系列，目录命名是 Xcode_16.X.app
          # 用 sudo 是因为 xcode-select --switch 在新系统需要 root
          XCODE_PATH="/Applications/Xcode_16.4.app"
          if [ ! -d "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.*.app | sort -V | tail -n 1)
          fi
          echo "选择 Xcode: $XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 注入 Marketing Version（仅 workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.versionName }}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" ClipSync/Info.plist
          echo "CFBundleShortVersionString=$VERSION"

      - name: Archive
        run: |
          xcodebuild \
            -project ClipSync.xcodeproj \
            -scheme ClipSync \
            -configuration Release \
            -archivePath build/ClipSync.xcarchive \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 导出 .app
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R build/ClipSync.xcarchive/Products/Applications/ClipSync.app dist/
          echo "📦 已生成 .app："
          ls -la dist/ClipSync.app
          du -sh dist/ClipSync.app

      - name: 打包成 zip
        run: |
          cd dist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ../ClipSync/Info.plist)
          ZIP_NAME="ClipSync-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent ClipSync.app "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          ls -la "$ZIP_NAME"

      - name: 打包成 DMG
        run: |
          cd dist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ../ClipSync/Info.plist)
          DMG_NAME="ClipSync-${VERSION}.dmg"
          hdiutil create -volname "ClipSync ${VERSION}" -srcfolder ClipSync.app -ov -format UDZO "$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          ls -la "$DMG_NAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: clip-sync-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: build
    # push tag 或 workflow_dispatch 都建 Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.versionName }}"
            if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
            echo "RELEASE_TAG=v$VERSION" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/v}
            echo "RELEASE_TAG=v$TAG" >> $GITHUB_OUTPUT
            VERSION=$TAG
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 检查 Release 是否已存在
        id: chk
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.RELEASE_TAG }}")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "  Release ${{ steps.ver.outputs.RELEASE_TAG }} 存在性: $code"

      - name: 发布 Release（仅当不存在时创建，避免重复更新被权限拦截）
        if: steps.chk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.RELEASE_TAG }}
          name: 'ClipSync Mac v${{ steps.ver.outputs.VERSION }}'
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg

  publish-package:
    name: 发布容器包到 GitHub Packages (ghcr.io)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    steps:
      - name: 下载 dmg/zip 产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.versionName }}"
            [ -z "$VERSION" ] && VERSION="0.0.0"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 打包成 OCI 容器镜像（把 dmg/zip 装进可分发的镜像）
        run: |
          test -n "$(find dist -name '*.dmg' -print -quit)" || { echo "❌ 没有 dmg"; exit 1; }
          STAGE=stage
          mkdir -p "$STAGE/app" "$STAGE/scratch"
          cp dist/*.dmg "$STAGE/app/" 2>/dev/null || true
          cp dist/*.zip "$STAGE/app/" 2>/dev/null || true
          cp dist/*.dmg "$STAGE/scratch/" 2>/dev/null || true
          cp dist/*.zip "$STAGE/scratch/" 2>/dev/null || true
          cat > "$STAGE/Dockerfile" <<'EOF'
          FROM scratch
          LABEL org.opencontainers.image.title="ClipSync macOS 安装包"
          LABEL org.opencontainers.image.description="ClipSync macOS 客户端 dmg/zip（OCI 容器包形式分发，文件在 /app/ 与 /scratch/）"
          LABEL com.clipsync.role="macos-installer"
          COPY app/ /app/
          COPY scratch/ /scratch/
          EOF
          docker build -t ghcr.io/${{ github.repository_owner }}/clipsync-mac:${{ steps.ver.outputs.VERSION }} \
                       -t ghcr.io/${{ github.repository_owner }}/clipsync-mac:latest "$STAGE"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push 容器包
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/clipsync-mac:${{ steps.ver.outputs.VERSION }}
          docker push ghcr.io/${{ github.repository_owner }}/clipsync-mac:latest
          echo "✅ 已推 ghcr.io/${{ github.repository_owner }}/clipsync-mac"
